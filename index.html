<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premier League 2026/27 Directory</title>
  <style>
    :root {
      --pl-purple: #38003c;
      --pl-dark: #1f0022;
      --pl-green: #00ff85;
      --pl-pink: #e90052;
      --bg-dark: #0f0212;
      --card-bg: #1a0521;
      --card-border: #330c3d;
      --text-main: #ffffff;
      --text-muted: #bda3c4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 3rem; }

    .app-header {
      background: linear-gradient(135deg, var(--pl-purple) 0%, var(--pl-dark) 100%);
      border-bottom: 3px solid var(--pl-green);
      padding: 1.5rem 1rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    @media (min-width: 768px) {
      .header-container { flex-direction: row; justify-content: space-between; }
    }

    .logo-title { display: flex; align-items: center; gap: 1rem; }
    .pl-lion-badge {
      background: var(--pl-green); color: var(--pl-purple);
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
    }

    h1 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; }
    .subtitle { color: var(--pl-green); font-size: 0.85rem; font-weight: 600; }

    .controls input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      padding: 0.75rem 1.25rem;
      color: white; width: 280px; font-size: 0.95rem; outline: none;
    }
    .controls input:focus { border-color: var(--pl-green); }

    .main-container { max-width: 1200px; margin: 2rem auto 0; padding: 0 1rem; }
    .stats-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.9rem;
    }
    .season-badge { background: var(--pl-pink); color: white; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: 700; font-size: 0.75rem; }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .team-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
    }
    .team-card:hover { border-color: var(--pl-green); transform: translateY(-3px); }

    .card-header { padding: 1.25rem; display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .badge-wrapper {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      transition: opacity 0.2s ease;
    }

    .badge-wrapper:hover { opacity: 0.85; }

    .badge-hint {
      font-size: 0.65rem;
      text-align: center;
      font-weight: bold;
      opacity: 0.75;
      padding: 2px;
      line-height: 1;
    }

    .file-input { display: none; }
    .team-name { font-size: 1.2rem; font-weight: 700; }
    .card-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .info-row { display: flex; flex-direction: column; }
    .info-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.15rem; }
    .info-value { font-size: 0.95rem; font-weight: 600; color: #efefef; }
    .highlight-star { color: #ffd700; }

    .site-footer {
      text-align: center;
      margin-top: 3rem;
      padding: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-container">
    <div class="logo-title">
      <div class="pl-lion-badge">PL</div>
      <div>
        <h1>Premier League 2026/27 Info</h1>
        <p class="subtitle">Official 2026/27 Season Directory</p>
      </div>
    </div>
    
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search team, manager, stadium, player..." />
    </div>
  </div>
</header>

<main class="main-container">
  <div class="stats-bar">
    <span>Showing <strong id="teamCount">20</strong> Clubs</span>
    <span class="season-badge">2026/27 Season</span>
  </div>

  <div class="teams-grid" id="teamsGrid"></div>
</main>

<footer class="site-footer">
  <p>Created by Rishi Pavan Serou</p>
</footer>

<script>
const teams = [
  { id: "arsenal", name: "Arsenal", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/arsenal.png", colors: { bg: "#DB0007", text: "#FFFFFF", secondary: "#063672" }, manager: "Mikel Arteta", stadium: "Emirates Stadium", bestPlayer: "Bukayo Saka", captain: "Martin Ødegaard" },
  { id: "astonvilla", name: "Aston Villa", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/astonvilla.png", colors: { bg: "#95BFE5", text: "#670E36", secondary: "#670E36" }, manager: "Unai Emery", stadium: "Villa Park", bestPlayer: "Ollie Watkins", captain: "John McGinn" },
  { id: "bournemouth", name: "Bournemouth", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/bournemouth.png", colors: { bg: "#DA291C", text: "#000000", secondary: "#000000" }, manager: "Marco Rose", stadium: "Vitality Stadium", bestPlayer: "Antoine Semenyo", captain: "Adam Smith" },
  { id: "brentford", name: "Brentford", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/brentford.png", colors: { bg: "#E30613", text: "#FFFFFF", secondary: "#FBB800" }, manager: "Keith Andrews", stadium: "Gtech Community Stadium", bestPlayer: "Yoane Wissa", captain: "Christian Nørgaard" },
  { id: "brighton", name: "Brighton & Hove Albion", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/brighton.png", colors: { bg: "#0057B8", text: "#FFFFFF", secondary: "#FFCD00" }, manager: "Fabian Hürzeler", stadium: "AMEX Stadium", bestPlayer: "Kaoru Mitoma", captain: "Lewis Dunk" },
  { id: "chelsea", name: "Chelsea", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/chelsea.png", colors: { bg: "#034694", text: "#FFFFFF", secondary: "#DBA111" }, manager: "Xabi Alonso", stadium: "Stamford Bridge", bestPlayer: "Cole Palmer", captain: "Reece James" },
  { id: "coventry", name: "Coventry City", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/coventry.png", colors: { bg: "#27AAE1", text: "#FFFFFF", secondary: "#003366" }, manager: "Frank Lampard", stadium: "Coventry Building Society Arena", bestPlayer: "Haji Wright", captain: "Ben Sheaf" },
  { id: "crystalpalace", name: "Crystal Palace", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/crystalpalace.png", colors: { bg: "#1B458F", text: "#FFFFFF", secondary: "#C41230" }, manager: "Pierre Sage", stadium: "Selhurst Park", bestPlayer: "Jean-Philippe Mateta", captain: "Eberechi Eze" },
  { id: "everton", name: "Everton", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/everton.png", colors: { bg: "#003399", text: "#FFFFFF", secondary: "#FFFFFF" }, manager: "David Moyes", stadium: "Hill Dickinson Stadium", bestPlayer: "Jarrad Branthwaite", captain: "Seamus Coleman" },
  { id: "fulham", name: "Fulham", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/fulham.png", colors: { bg: "#FFFFFF", text: "#000000", secondary: "#CC0000" }, manager: "Álvaro Arbeloa", stadium: "Craven Cottage", bestPlayer: "Rodrigo Muniz", captain: "Tom Cairney" },
  { id: "hull", name: "Hull City", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/hull.png", colors: { bg: "#FF8200", text: "#000000", secondary: "#000000" }, manager: "Sergej Jakirović", stadium: "MKM Stadium", bestPlayer: "Oli McBurnie", captain: "Lewie Coyle" },
  { id: "ipswich", name: "Ipswich Town", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/ipswich.png", colors: { bg: "#0000FF", text: "#FFFFFF", secondary: "#FF0000" }, manager: "Gary O'Neil", stadium: "Portman Road", bestPlayer: "Omari Hutchinson", captain: "Sam Morsy" },
  { id: "leeds", name: "Leeds United", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/leeds.png", colors: { bg: "#FFCD00", text: "#1D2554", secondary: "#1D2554" }, manager: "Daniel Farke", stadium: "Elland Road", bestPlayer: "Crysencio Summerville", captain: "Ethan Ampadu" },
  { id: "liverpool", name: "Liverpool", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/liverpool.png", colors: { bg: "#C8102E", text: "#FFFFFF", secondary: "#00B2A9" }, manager: "Andoni Iraola", stadium: "Anfield", bestPlayer: "Alexander Isak", captain: "Virgil van Dijk" },
  { id: "mancity", name: "Manchester City", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/mancity.png", colors: { bg: "#6CABDD", text: "#1C2C5B", secondary: "#1C2C5B" }, manager: "Enzo Maresca", stadium: "Etihad Stadium", bestPlayer: "Erling Haaland", captain: "Kyle Walker" },
  { id: "manutd", name: "Manchester United", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/manutd.png", colors: { bg: "#DA291C", text: "#FFFFFF", secondary: "#FBE122" }, manager: "Michael Carrick", stadium: "Old Trafford", bestPlayer: "Bryan Mbeumo", captain: "Bruno Fernandes" },
  { id: "newcastle", name: "Newcastle United", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/newcastle.png", colors: { bg: "#241F20", text: "#FFFFFF", secondary: "#41B6E6" }, manager: "Eddie Howe", stadium: "St. James' Park", bestPlayer: "Sandro Tonali", captain: "Bruno Guimarães" },
  { id: "nottingham", name: "Nottingham Forest", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/nottingham.png", colors: { bg: "#DD0000", text: "#FFFFFF", secondary: "#FFFFFF" }, manager: "Oliver Glasner", stadium: "The City Ground", bestPlayer: "Morgan Gibbs-White", captain: "Ryan Yates" },
  { id: "sunderland", name: "Sunderland", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/sunderland.png", colors: { bg: "#EB172B", text: "#FFFFFF", secondary: "#000000" }, manager: "Régis Le Bris", stadium: "Stadium of Light", bestPlayer: "Jobe Bellingham", captain: "Dan Neil" },
  { id: "tottenham", name: "Tottenham Hotspur", logo: "https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/tottenham.png", colors: { bg: "#FFFFFF", text: "#132257", secondary: "#132257" }, manager: "Roberto De Zerbi", stadium: "Tottenham Hotspur Stadium", bestPlayer: "James Maddison", captain: "Richarlison" }
];

// Load local uploads from browser storage if present
const customImages = JSON.parse(localStorage.getItem('pl_team_badges')) || {};

function triggerFileUpload(teamId) {
  document.getElementById(`file-${teamId}`).click();
}

function handleFileSelect(event, teamId) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      customImages[teamId] = e.target.result;
      localStorage.setItem('pl_team_badges', JSON.stringify(customImages));
      renderTeams(document.getElementById("searchInput").value);
    };
    reader.readAsDataURL(file);
  }
}

function renderTeams(filterText = "") {
  const grid = document.getElementById("teamsGrid");
  const countEl = document.getElementById("teamCount");
  
  const filtered = teams.filter(team => {
    const query = filterText.toLowerCase();
    return (
      team.name.toLowerCase().includes(query) ||
      team.manager.toLowerCase().includes(query) ||
      team.stadium.toLowerCase().includes(query) ||
      team.bestPlayer.toLowerCase().includes(query) ||
      team.captain.toLowerCase().includes(query)
    );
  });

  countEl.textContent = filtered.length;

  grid.innerHTML = filtered.map(team => {
    const imageSource = customImages[team.id] || team.logo;
    const bgStyle = imageSource 
      ? `background-image: url('${imageSource}');` 
      : `background-color: ${team.colors.bg}; color: ${team.colors.text};`;

    return `
    <article class="team-card">
      <div class="card-header">
        <input type="file" id="file-${team.id}" class="file-input" accept="image/*" onchange="handleFileSelect(event, '${team.id}')" />
        <div class="badge-wrapper" onclick="triggerFileUpload('${team.id}')" title="Click to upload/change logo" style="${bgStyle} border: 3px solid ${team.colors.secondary}">
          ${!imageSource ? `<span class="badge-hint">UPLOAD<br/>BADGE</span>` : ''}
        </div>
        <h2 class="team-name">${team.name}</h2>
      </div>
      <div class="card-body">
        <div class="info-row">
          <span class="info-label">Manager</span>
          <span class="info-value">${team.manager}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Stadium</span>
          <span class="info-value">${team.stadium}</span>
        </div>
        <div class="info-row">
          <span class="info-label"><span class="highlight-star">★</span> Best Player</span>
          <span class="info-value">${team.bestPlayer}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Captain</span>
          <span class="info-value">${team.captain}</span>
        </div>
      </div>
    </article>
  `}).join("");
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  renderTeams(e.target.value);
});

renderTeams();
</script>
</body>
</html>
